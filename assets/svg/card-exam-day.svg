    <path d="M64 64 h50 M64 84 h80 M64 104 h40"/><path d="M180 60 l14 14 l22 -26"/><circle cx="230" cy="110" r="14"/>
  </g>
  <text x="165" y="138" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-weight="900" font-size="18" fill="#fff" opacity=".9">加油！</text>
  <!-- 時鐘 -->

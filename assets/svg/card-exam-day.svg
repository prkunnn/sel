    <circle cx="-11" cy="4" r="4.5" fill="#23395b"/><circle cx="12" cy="4" r="4.5" fill="#23395b"/>
    <path d="M-5 18 q5 -4 10 0" stroke="#23395b" stroke-width="3" fill="none" stroke-linecap="round"/>
